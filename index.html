<!doctype html>
<html lang="it">
<head>

<title>Carezza del Mare - Guest Guide</title>
<style>
:root{--deep:#063b46;--sea:#075b67;--turq:#238b91;--foam:#f2faf8;--sand:#d9c095;--coral:#c86f56;--ink:#173a3d;--muted:#607579;--line:#d5e8e4}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,var(--foam),#fffaf2);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}header{padding:28px 20px 20px;color:#fff;background:linear-gradient(135deg,var(--deep),var(--sea) 55%,var(--turq));box-shadow:0 8px 24px #063b4633}.wrap{max-width:1120px;margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:1rem;font-weight:800;color:#d9f2ee}.langbox{display:flex;gap:7px;flex-wrap:wrap}.flagbtn{border:2px solid transparent;background:#ffffff18;border-radius:12px;padding:5px 7px;cursor:pointer;font-size:1.4rem}.flagbtn.active{border-color:var(--sand);background:#fff}h1,h2{font-family:Georgia,serif}h1{font-size:clamp(2rem,5vw,3.2rem);margin:.2rem 0}header p{margin:.2rem 0;color:#eaf7f5}nav{display:flex;gap:8px;overflow:auto;padding-top:14px}.navbtn{border:1px solid #b9d9d5;background:#ffffffe6;color:var(--deep);border-radius:999px;padding:8px 13px;white-space:nowrap;cursor:pointer;font-weight:700}.navbtn.active{background:var(--sand);border-color:var(--sand)}main{padding:22px 20px}.intro{background:#ffffffdf;border:1px solid var(--line);border-radius:24px;padding:24px;margin:18px 0;box-shadow:0 10px 30px #063b4614}.note{border-left:4px solid var(--turq);padding:12px 15px;background:#eef8f6;border-radius:8px}section{margin:28px 0}h2{font-size:1.85rem;color:var(--deep);margin:28px 0 12px}h2:after{content:"";display:block;width:55px;height:3px;background:linear-gradient(90deg,var(--turq),var(--sand));margin-top:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 5px 20px #063b460d}.card h3{margin:.15rem 0;color:var(--deep)}.tag{display:inline-block;background:#e3f2ef;color:#175864;border-radius:999px;padding:4px 9px;font-size:.76rem;margin:2px 3px 7px 0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.actions a{color:var(--sea);font-weight:750;text-decoration:none;border:1px solid #a9d6d2;background:var(--foam);border-radius:999px;padding:7px 10px}.eventday{color:var(--coral);font-weight:800;text-transform:uppercase;font-size:.78rem;letter-spacing:.07em}.event-source{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:-2px 0 16px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#ffffffb8;color:var(--muted);font-size:.9rem}.event-source strong{color:var(--deep)}.event-source a{color:var(--sea);font-weight:800}.dot{width:9px;height:9px;border-radius:50%;background:var(--sand)}.ok .dot{background:#49a078}.error .dot{background:var(--coral)}.event-details{color:var(--muted);font-size:.91rem}.beach-type{color:var(--sea);font-weight:800}footer{text-align:center;padding:35px;color:var(--muted);font-size:.85rem}footer a{color:var(--sea)}@media(max-width:700px){.topbar{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header><div class="wrap"><div class="topbar"><div class="eyebrow">Casa Vacanze Carezza del Mare</div><div class="langbox" role="group" aria-label="Scegli la lingua"><button class="flagbtn" data-lang="it" title="Italiano">🇮🇹</button><button class="flagbtn" data-lang="en" title="English">🇬🇧</button><button class="flagbtn" data-lang="de" title="Deutsch">🇩🇪</button><button class="flagbtn" data-lang="fr" title="Français">🇫🇷</button><button class="flagbtn" data-lang="es" title="Español">🇪🇸</button></div></div><h1 id="mainTitle"></h1><p id="subtitle"></p><nav id="nav"></nav></div></header>
<main class="wrap"><section class="intro"><strong id="welcome"></strong><p id="introText"></p><div class="note" id="notice"></div></section><div id="app"></div></main>
<footer>Carezza del Mare - Costa dei Trabocchi<br>Per informazioni: <a href="mailto:staniscia.luigi@gmail.com">staniscia.luigi@gmail.com</a></footer>
<script>
const D={
events:[["12 settembre","Sirventés","Palena","Dalle 17:00"],["13 settembre","Pedalando in e-bike","Fossacesia","Ore 08:30"],["17 settembre","Val di Sangro Expo","Atessa","15:00-21:00"]],
beaches:[["Le Morge","Torino di Sangro","Sabbia e piccoli ciottoli","Spiaggia comoda e vicina, adatta alle famiglie."],["Fossacesia Marina","Fossacesia","Ciottoli","Ampio litorale lungo la Costa dei Trabocchi."],["Calata Turchino","San Vito Chietino","Ciottoli","Caletta iconica nei pressi del Trabocco Turchino."],["Punta Penna","Vasto","Sabbia","Ampia spiaggia sabbiosa in un contesto naturale."],["Punta Aderci","Vasto","Ciottoli e ghiaia","Spiaggia e promontorio nella riserva naturale."]],
rentals:[["BiciMania","Fossacesia Marina","Noleggio biciclette vicino alla Via Verde.","3346092310","https://www.noleggiobicitrabocchi.eu/"],["Bike To Beach","San Vito Chietino","Noleggio bici ed e-bike, Via Frentana 138.","3738569544",null],["Green Road","Ortona","Bici tradizionali, e-bike e servizi per ciclisti, Lido Saraceni.","3887210195","https://reteciclabiletrabocchi.it/consigli/bike-point-23143"]],
borghi:[["Vasto","Centro storico, Loggia Amblingh e passeggiata panoramica."],["Lanciano","Centro storico e mercati comunali."],["Ortona","Castello Aragonese e Passeggiata Orientale."]],
mountains:[["Guardiagrele","Maiella - borgo","Centro storico, panorami e dolci tipici."],["Castello di Roccascalegna","Valle del Sangro - castello","Fortificazione medievale su uno sperone roccioso."],["Fara San Martino e Sorgenti del Verde","Maiella - natura","Borgo, sorgenti del fiume Verde e paesaggio montano."]],
experiences:[["Via Verde dei Trabocchi","Bici e passeggiata lungo la costa.",null,null],["Cena su un trabocco","Una delle esperienze simbolo della costa.",null,null],["Majellando","Tour operator outdoor abruzzese.","3496648985","https://www.majellando.it/it"]],
restaurants:[["Cantina Effendi","Torino di Sangro","Cucina informale e curata vicino a casa.","3773347004",null],["Trabocco Pesce Palombo","Fossacesia","Ristorante sul trabocco con specialità di pesce.","3333055300","https://www.traboccopescepalombo.it/"],["Ristoro Punta Le Morge","Torino di Sangro","Ristoro vicino alla spiaggia e alla Via Verde.","3393484009","https://ristoropuntalemorge.it/"]]
};
const UI={
it:{title:'La vostra guida alla Costa dei Trabocchi',subtitle:'Mare, bici, borghi, montagna, sapori ed eventi scelti per voi.',welcome:'Benvenuti!',intro:'Una guida pratica per scoprire la Costa dei Trabocchi e l’entroterra abruzzese.',notice:'<strong>Prima di partire:</strong> verificate sempre orari, disponibilità e condizioni di accesso.',sections:['Eventi della settimana','Mare & spiagge','Bici, Via Verde & noleggi','Borghi & città','Maiella & montagna','Natura & esperienze','Mangiare & bere'],call:'Chiama',site:'Sito web',map:'Mappa',pdfLoading:'Aggiornamento eventi dal PDF...',pdfOk:'Eventi letti dal calendario PDF',pdfError:'PDF non disponibile o non interpretabile: visualizzo gli eventi salvati',pdfOpen:'Apri il calendario PDF',beach:'Tipo di spiaggia'},
en:{title:'Your guide to the Costa dei Trabocchi',subtitle:'Sea, cycling, villages, mountains, food and events selected for you.',welcome:'Welcome!',intro:'A practical guide to the Costa dei Trabocchi and inland Abruzzo.',notice:'<strong>Before you go:</strong> always check times, availability and access.',sections:['Events this week','Sea & beaches','Cycling & rentals','Towns & villages','Maiella & mountains','Nature & experiences','Food & drink'],call:'Call',site:'Website',map:'Map',pdfLoading:'Updating events from PDF...',pdfOk:'Events read from PDF calendar',pdfError:'PDF unavailable or unreadable: showing saved events',pdfOpen:'Open PDF calendar',beach:'Beach type'},
de:{title:'Ihr Reiseführer zur Costa dei Trabocchi',subtitle:'Meer, Radfahren, Dörfer, Berge und Veranstaltungen.',welcome:'Willkommen!',intro:'Ein praktischer Reiseführer für die Costa dei Trabocchi.',notice:'<strong>Vor der Abfahrt:</strong> Zeiten und Verfügbarkeit prüfen.',sections:['Veranstaltungen','Meer & Strände','Radfahren & Verleih','Orte & Städte','Maiella & Berge','Natur & Erlebnisse','Essen & Trinken'],call:'Anrufen',site:'Webseite',map:'Karte',pdfLoading:'PDF wird gelesen...',pdfOk:'Veranstaltungen aus dem PDF',pdfError:'PDF nicht lesbar: gespeicherte Veranstaltungen',pdfOpen:'PDF öffnen',beach:'Strandart'},
fr:{title:'Votre guide de la Costa dei Trabocchi',subtitle:'Mer, vélo, villages, montagne et événements.',welcome:'Bienvenue !',intro:'Un guide pratique de la Costa dei Trabocchi.',notice:'<strong>Avant de partir :</strong> vérifiez horaires et disponibilités.',sections:['Événements','Mer & plages','Vélo & locations','Bourgs & villes','Maiella & montagne','Nature & expériences','Manger & boire'],call:'Appeler',site:'Site web',map:'Carte',pdfLoading:'Lecture du PDF...',pdfOk:'Événements lus dans le PDF',pdfError:'PDF illisible : événements enregistrés',pdfOpen:'Ouvrir le PDF',beach:'Type de plage'},
es:{title:'Tu guía de la Costa dei Trabocchi',subtitle:'Mar, ciclismo, pueblos, montaña y eventos.',welcome:'¡Bienvenidos!',intro:'Una guía práctica de la Costa dei Trabocchi.',notice:'<strong>Antes de salir:</strong> comprueba horarios y disponibilidad.',sections:['Eventos','Mar y playas','Bicicleta y alquiler','Pueblos y ciudades','Maiella y montaña','Naturaleza y experiencias','Comer y beber'],call:'Llamar',site:'Sitio web',map:'Mapa',pdfLoading:'Leyendo el PDF...',pdfOk:'Eventos leídos del PDF',pdfError:'PDF no legible: eventos guardados',pdfOpen:'Abrir PDF',beach:'Tipo de playa'}};
let lang=localStorage.getItem('carezza_lang')||'it';
const PDF_PATH='eventi/calendario-eventi.pdf';
const FALLBACK_EVENTS=D.events.map(x=>x.slice());
const pdfState={status:'loading',count:0};
const MONTHS='GENNAIO|FEBBRAIO|MARZO|APRILE|MAGGIO|GIUGNO|LUGLIO|AGOSTO|SETTEMBRE|OTTOBRE|NOVEMBRE|DICEMBRE';
const DAYS='LUNED[IÌ]|MARTED[IÌ]|MERCOLED[IÌ]|GIOVED[IÌ]|VENERD[IÌ]|SABATO|DOMENICA';
const PLACES=['ATESSA','CASALBORDINO','COLLEDIMEZZO','FARA SAN MARTINO','FOSSACESIA','GUARDIAGRELE','LAMA DEI PELIGNI','LANCIANO','ORTONA','PALENA','ROCCA SAN GIOVANNI','ROCCA S. GIOVANNI','SAN VITO CHIETINO','SANTA MARIA IMBARO','TORINO DI SANGRO','VASTO'];
const DATE_ANY_RE=new RegExp('(?:'+DAYS+')?\\s*(?:DAL\\s+)?\\d{1,2}(?:\\s*(?:-|–|AL)\\s*\\d{1,2})?\\s+(?:'+MONTHS+')(?:\\s+20\\d{2})?','i');
const cleanText=x=>String(x||'').replace(/\s+/g,' ').replace(/^#+\s*/,'').replace(/[*_]+/g,'').trim();
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const titleCase=s=>s.toLowerCase().replace(/(^|\s)[a-zà-ÿ]/g,m=>m.toUpperCase());
function normalizedDate(s){const x=cleanText(s).toUpperCase();if(/TUTTI I GIORNI/.test(x))return 'Tutti i giorni';const m=x.match(DATE_ANY_RE);if(!m)return null;let d=m[0].replace(/\s+/g,' ').trim();if(/^DAL\s/i.test(d))d=d.replace(/^DAL\s+/i,'Dal ');return titleCase(d)}
function findPlace(s){const x=cleanText(s).toUpperCase();const hits=PLACES.filter(p=>x.includes(p)).sort((a,b)=>b.length-a.length);if(!hits.length)return null;return titleCase(hits[0]).replace('Rocca S. Giovanni','Rocca San Giovanni')}
function splitMarkers(text){let rest=cleanText(text),date=null,place=null;const up=rest.toUpperCase();if(up.includes('TUTTI I GIORNI')){date='Tutti i giorni';rest=rest.replace(/TUTTI I GIORNI/i,' ').trim()}else{const m=rest.match(DATE_ANY_RE);if(m){date=normalizedDate(m[0]);rest=(rest.slice(0,m.index)+' '+rest.slice(m.index+m[0].length)).trim()}}
const pl=findPlace(rest);if(pl){place=pl;const variants=PLACES.sort((a,b)=>b.length-a.length);for(const p of variants){const re=new RegExp(p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');if(re.test(rest)){rest=rest.replace(re,' ').trim();break}}}return{date,place,rest:cleanText(rest)}}
function isMeta(s){return /^(ore|dalle|info|c\/o|ritrovo|ticket|sconto|piazza|via |villa |chiesa |stazione |spiaggia |lido |agriturismo |punto di ritrovo)/i.test(cleanText(s))}
function isTitle(s,size,base){const x=cleanText(s);return x.length>=3&&x.length<=100&&!/[.!?]$/.test(x)&&!isMeta(x)&&(size>=Math.max(10.5,base*1.05)||x.split(' ').length<=7)}
async function pdfColumns(pdf){const output=[];for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p),vp=page.getViewport({scale:1}),tc=await page.getTextContent();const items=tc.items.map(i=>({text:cleanText(i.str),x:i.transform[4],y:i.transform[5],w:i.width||0,size:Math.abs(i.transform[3])||i.height||10})).filter(i=>i.text);const thirds=[[],[],[]];for(const it of items){const mid=it.x+it.w/2;let c=Math.min(2,Math.max(0,Math.floor(mid/(vp.width/3))));if(it.w>vp.width*.55)c=0;thirds[c].push(it)}
for(let c=0;c<3;c++){const rows=[];for(const it of thirds[c]){const y=Math.round(it.y*2)/2;let r=rows.find(z=>Math.abs(z.y-y)<2.4);if(!r){r={y,size:it.size,parts:[]};rows.push(r)}r.size=Math.max(r.size,it.size);r.parts.push(it)}rows.sort((a,b)=>b.y-a.y);for(const r of rows){r.parts.sort((a,b)=>a.x-b.x);output.push({page:p,col:c,size:r.size,text:cleanText(r.parts.map(z=>z.text).join(' '))})}}}return output}
function parseEvents(lines){const sizes=lines.map(x=>x.size).filter(Number.isFinite).sort((a,b)=>a-b),base=sizes[Math.floor(sizes.length/2)]||10,result=[];let date='',place='',ev=null,lastKey='';const flush=()=>{if(!ev||!ev.title){ev=null;return}const detail=ev.body.join(' ').replace(/\s+/g,' ').trim();result.push([ev.date||date,ev.title,ev.place||place,ev.time||'',detail,ev.info||'']);ev=null};for(const row of lines){const key=row.page+'|'+row.col;if(key!==lastKey){flush();date='';place='';lastKey=key}const mark=splitMarkers(row.text);if(mark.date){flush();date=mark.date}if(mark.place){flush();place=mark.place}const text=mark.rest;if(!text)continue;if(/^(ARTE|PRODOTTI TIPICI|FIERA)$/i.test(text))continue;if(/DAL 17 AL 24 SETTEMBRE 2026/i.test(row.text))continue;if(!date&&!place)continue;if(isTitle(text,row.size,base)){flush();ev={date,place,title:text,time:'',info:'',body:[]};continue}if(!ev)continue;if(/^(ore|dalle)\b/i.test(text)){ev.time=text;continue}if(/^info\s*:/i.test(text)){ev.info=text.replace(/^info\s*:\s*/i,'');continue}ev.body.push(text)}flush();const seen=new Set();return result.filter(x=>{const k=(x[0]+'|'+x[1]+'|'+x[2]).toLowerCase();if(seen.has(k))return false;seen.add(k);return x[0]&&x[1]&&x[1].length>2}).slice(0,100)}
async function updateEventsFromPdf(){try{const pdfjs=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/legacy/build/pdf.mjs');pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/legacy/build/pdf.worker.mjs';const pdf=await pdfjs.getDocument({url:PDF_PATH+'?v='+Date.now()}).promise;const parsed=parseEvents(await pdfColumns(pdf));console.table(parsed.map(x=>({data:x[0],evento:x[1],luogo:x[2]})));if(parsed.length<2)throw new Error('Eventi riconosciuti insufficienti');D.events=parsed;pdfState.status='ok';pdfState.count=parsed.length}catch(err){console.warn('Calendario PDF:',err);D.events=FALLBACK_EVENTS.map(x=>x.slice());pdfState.status='error';pdfState.count=D.events.length}render()}
const defs=['events','beaches','rentals','borghi','mountains','experiences','restaurants'];
const nav=document.getElementById('nav'),app=document.getElementById('app');
const mapLink=(name,place='')=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(name+' '+place);
function buttons(name,place='',phone=null,site=null){const u=UI[lang];return `<div class="actions">${phone?`<a href="tel:${phone}">${u.call}</a>`:''}${site?`<a target="_blank" rel="noopener" href="${site}">${u.site}</a>`:''}<a target="_blank" rel="noopener" href="${mapLink(name,place)}">${u.map}</a></div>`}
function card(x){return `<article class="card">${x}</article>`}
function render(){const u=UI[lang];document.documentElement.lang=lang;document.querySelectorAll('.flagbtn').forEach(x=>x.classList.toggle('active',x.dataset.lang===lang));mainTitle.textContent=u.title;subtitle.textContent=u.subtitle;welcome.textContent=u.welcome;introText.textContent=u.intro;notice.innerHTML=u.notice;nav.innerHTML='';app.innerHTML='';defs.forEach((key,i)=>{const b=document.createElement('button');b.className='navbtn'+(i===0?' active':'');b.textContent=u.sections[i];b.onclick=()=>document.getElementById('s'+i).scrollIntoView();nav.appendChild(b);const s=document.createElement('section');s.id='s'+i;s.innerHTML=`<h2>${u.sections[i]}</h2>${key==='events'?`<div class="event-source ${pdfState.status}"><span class="dot"></span><strong>${pdfState.status==='loading'?u.pdfLoading:pdfState.status==='ok'?u.pdfOk+' ('+pdfState.count+')':u.pdfError}</strong><a href="${PDF_PATH}" target="_blank">${u.pdfOpen}</a></div>`:''}<div class="grid"></div>`;const g=s.querySelector('.grid');if(key==='events')D.events.forEach(x=>g.insertAdjacentHTML('beforeend',card(`<div class="eventday">${esc(x[0])}</div><h3>${esc(x[1])}</h3><strong>${esc(x[2])}</strong>${[x[3],x[4]].filter(Boolean).length?`<p class="event-details">${[x[3],x[4]].filter(Boolean).map(esc).join(' - ')}</p>`:''}${x[5]?`<div class="event-details"><strong>Info:</strong> ${esc(x[5])}</div>`:''}${buttons(x[1],x[2])}`)));if(key==='beaches')D.beaches.forEach(x=>g.insertAdjacentHTML('beforeend',card(`<span class="tag">${x[1]}</span><h3>${x[0]}</h3><div class="beach-type">🏖️ ${u.beach}: ${x[2]}</div><p>${x[3]}</p>${buttons(x[0],x[1])}`)));if(key==='rentals')D.rentals.forEach(x=>g.insertAdjacentHTML('beforeend',card(`<span class="tag">${x[1]}</span><h3>${x[0]}</h3><p>${x[2]}</p>${buttons(x[0],x[1],x[3],x[4])}`)));if(key==='borghi')D.borghi.forEach(x=>g.insertAdjacentHTML('beforeend',card(`<h3>${x[0]}</h3><p>${x[1]}</p>${buttons(x[0])}`)));if(key==='mountains')D.mountains.forEach(x=>g.insertAdjacentHTML('beforeend',card(`<span class="tag">${x[1]}</span><h3>${x[0]}</h3><p>${x[2]}</p>${buttons(x[0])}`)));if(key==='experiences')D.experiences.forEach(x=>g.insertAdjacentHTML('beforeend',card(`<h3>${x[0]}</h3><p>${x[1]}</p>${buttons(x[0],'',x[2],x[3])}`)));if(key==='restaurants')D.restaurants.forEach(x=>g.insertAdjacentHTML('beforeend',card(`<span class="tag">${x[1]}</span><h3>${x[0]}</h3><p>${x[2]}</p>${buttons(x[0],x[1],x[3],x[4])}`)));app.appendChild(s)})}
document.querySelectorAll('.flagbtn').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;localStorage.setItem('carezza_lang',lang);render()}));render();updateEventsFromPdf();
</script>
